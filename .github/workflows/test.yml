name: Test

on:
  pull_request:
    branches:
      - main
      - mvp

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: setlet_test
          POSTGRES_USER: setlet
          POSTGRES_PASSWORD: setlet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setlet -d setlet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests with coverage
        working-directory: backend
        env:
          POSTGRES_USER: setlet
          POSTGRES_PASSWORD: setlet
          REQUIRE_PG: "1"
          SECRET_KEY: test-secret
        run: |
          export TEST_DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/setlet_test"
          pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
